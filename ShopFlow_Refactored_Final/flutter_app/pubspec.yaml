name: shopflow
description: ShopFlow mobile e-commerce app — System 3 of 3.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0

  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.5
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
